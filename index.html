<html lang="ja">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3f5f2;--card:#fff;--ink:#1d2a26;--sub:#5d6b66;--line:#d5dcd7;--ok:#1f7a4d;--ng:#c2402a;--main:#1f5c7a;--mainink:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15191a;--card:#1f2527;--ink:#e8eeeb;--sub:#9aa8a2;--line:#33403b;--ok:#4fbf86;--ng:#ef7a63;--main:#5aa6c8;--mainink:#0f1a1f}}
:root[data-theme="dark"]{--bg:#15191a;--card:#1f2527;--ink:#e8eeeb;--sub:#9aa8a2;--line:#33403b;--ok:#4fbf86;--ng:#ef7a63;--main:#5aa6c8;--mainink:#0f1a1f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Hiragino Sans","Yu Gothic UI","Noto Sans JP",sans-serif}
main{max-width:640px;margin:0 auto;padding:16px 14px 90px}
h1{font-size:19px;margin:6px 0 14px}
h2{font-size:15px;margin:22px 0 8px;color:var(--main)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
label.f{display:block;font-size:13px;color:var(--sub);margin-bottom:8px}
input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{width:100%;font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;padding:11px 6px;border:1px solid var(--main);background:transparent;color:var(--main);border-radius:8px;font:inherit;font-weight:700}
.tabs button.on{background:var(--main);color:var(--mainink)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.item .t{font-weight:600}.item .c{font-size:13px;color:var(--sub);margin:2px 0 8px}
.seg{display:flex;gap:6px}
.seg label{flex:1}.seg input{position:absolute;opacity:0}
.seg span{display:block;text-align:center;padding:10px 4px;border:1px solid var(--line);border-radius:8px;font-weight:700}
.seg input:checked+span.g{background:var(--ok);color:#fff;border-color:var(--ok)}
.seg input:checked+span.b{background:var(--ng);color:#fff;border-color:var(--ng)}
.seg input:checked+span.n{background:var(--sub);color:#fff;border-color:var(--sub)}
.seg input:focus-visible+span{outline:3px solid var(--main)}
.item.bad{border-color:var(--ng)}
.item textarea{margin-top:8px;display:none;min-height:60px}.item.bad textarea{display:block}
.sign{border:2px dashed var(--line);border-radius:10px;background:#fff;touch-action:none;width:100%;aspect-ratio:2/1;height:auto;display:block}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:10px;background:var(--main);color:var(--mainink);font:inherit;font-weight:700;margin-top:10px}
.btn.sub{background:transparent;color:var(--main);border:1px solid var(--main);padding:9px;margin-top:6px}
.err{white-space:pre-line;color:var(--ng);font-size:14px;min-height:20px;margin-top:8px}
.prog{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:6px 0;font-size:13px;color:var(--sub);z-index:2}
.board{position:relative;width:100%;aspect-ratio:4/3;border:1px solid var(--line);border-radius:10px;background:#fff;touch-action:none;overflow:hidden;margin:10px 0}
.lc{position:absolute;transform:translate(-50%,-50%);line-height:0;padding:0;border-radius:2px;cursor:grab;user-select:none;touch-action:none}.lc::after{content:"";position:absolute;inset:-8px}.lc img{display:block;width:100%;pointer-events:none;-webkit-user-drag:none}
.lc.sel{outline:3px solid var(--main);outline-offset:2px}#devs,#rooms{flex-direction:column;flex-wrap:nowrap}.dv{flex:none;width:100%;display:flex;gap:3px;min-width:0}.dv .tb{flex:1;min-width:0;text-align:left;padding-left:14px}.dv .dx{flex:0 0 42px;padding:0;border-color:var(--ng);color:var(--ng);font-size:18px}.dv .dx.arm{flex:0 0 64px;background:var(--ng);color:#fff;font-size:14px}.thumbs{display:flex;flex-wrap:wrap;gap:10px}.th{position:relative;width:84px;height:84px}.th img{width:100%;height:100%;object-fit:cover;border-radius:8px;border:1px solid var(--line)}.th button{position:absolute;top:-8px;right:-8px;width:28px;height:28px;border-radius:50%;border:0;background:var(--ng);color:#fff;font-size:16px;line-height:1}
.pal{display:flex;flex-wrap:wrap;gap:6px}
.pal button{border:1px solid var(--line);background:#fff;color:#111;padding:6px 6px;border-radius:10px;font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;width:78px}.pal button img{height:36px;width:auto;max-width:50px}
.hide{display:none!important}
.row2>*{min-width:0}
input[type=date],input[type=time]{min-width:0;max-width:100%;-webkit-appearance:none;appearance:none;min-height:42px;display:block}
.card.fs{position:fixed;inset:0;z-index:50;margin:0;border-radius:0;display:flex;flex-direction:column;gap:6px;background:var(--bg);overflow:hidden;padding:calc(8px + env(safe-area-inset-top,0px)) calc(8px + env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) calc(8px + env(safe-area-inset-left,0px))}
.card.fs #bstage{flex:1;min-height:0;min-width:0;overflow:hidden;display:flex;align-items:center;justify-content:center}.card.fs .board{flex:none;aspect-ratio:auto;margin:0}.card.fs .lhint{display:none}
.card.fs .pal{flex-wrap:nowrap;overflow-x:auto;flex:none}
.card.fs .pal button{flex:0 0 auto;width:72px}
.card.fs .row2{flex:none}.card.fs .btn{padding:8px;margin-top:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 4px}.chip{padding:7px 12px;border-radius:16px;border:1px solid var(--main);background:transparent;color:var(--main);font:inherit;font-size:14px}.chip.on{background:var(--main);color:var(--mainink)}.chipx{border:0;background:transparent;color:var(--sub);font:inherit;font-size:12px;text-decoration:underline;padding:6px}
.miss{outline:2px solid var(--ng);outline-offset:2px;border-radius:8px}.item.miss{border-color:var(--ng)}.item.miss::after{content:attr(data-miss);display:block;color:var(--ng);font-size:13px;font-weight:700;margin-top:6px}
.tubes{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}.tubes label{display:flex;align-items:center;gap:6px;padding:8px 14px;border:1px solid var(--line);border-radius:18px}.tubes label:has(input:checked){background:var(--main);color:var(--mainink);border-color:var(--main)}
@media (orientation:landscape) and (max-height:600px){.card.fs{display:grid;grid-template-columns:minmax(0,1fr) 190px;grid-template-rows:repeat(5,auto) 1fr;column-gap:8px;row-gap:6px}.card.fs #bstage{grid-column:1;grid-row:1/-1}.card.fs>*:not(#bstage){grid-column:2}.card.fs .pal{flex-wrap:wrap;overflow-x:hidden;overflow-y:auto;max-height:48vh}.card.fs .pal button{flex:0 0 calc(50% - 3px);width:auto}}
.wk{display:none;margin-top:8px;padding:8px 10px;border:1px dashed var(--line);border-radius:8px}.item.bad .wk,.wk.always{display:block}.wkt{font-size:13px;color:var(--sub);margin-bottom:4px}.wl{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;padding:5px 0}.wl label{display:flex;align-items:center;gap:8px}.wl input[type=checkbox]{width:22px;height:22px;flex:none}.cg{display:inline-flex;gap:10px}.cg label{display:flex;align-items:center;gap:4px}.cg input{width:22px;height:22px}.wl input.nm{width:88px;padding:6px 8px;text-align:right}
</style>
</head>
<body>
<main>
<h1>感覚統合器具メンテナンスチェックシート</h1>
<div class="tabs" id="tabs"></div>

<h2>点検情報</h2>
<div class="card">
 <div class="row2"><label class="f">点検日<input type="date" id="date"></label><label class="f">検査員名<input type="text" id="inspector"></label></div>
 <div class="row2"><label class="f">開始<input type="time" id="start"></label><label class="f">終了<input type="time" id="end"></label></div>
 <label class="f">施設名<input type="text" id="facility"></label>
 
 <div class="row2" id="roomWrap"><label class="f">器具数（自動）<input type="text" id="gcount" readonly></label><label class="f">部屋数（自動）<input type="text" id="rcount" readonly></label></div>
</div>

<h2>① 部屋（天井ロープ等）</h2><div class="card"><div class="tabs" id="rooms"></div><button class="btn sub" id="addR" type="button" style="margin-top:0">＋ 部屋を追加</button></div>
<h2>② 点検する器具（スイング他）</h2><div class="card"><div class="tabs" id="devs"></div><button class="btn sub" id="addS" type="button" style="margin-top:0">＋ 器具を追加</button></div>
<div id="devArea" style="display:none"><h2>点検項目</h2><div class="card" id="roomCard"><label class="f">部屋名<input type="text" id="room" list="rnlist" autocomplete="off" placeholder="入力、または下の履歴から選択"></label><datalist id="rnlist"></datalist><div class="chips" id="rchips"></div></div><div class="card" id="prodCard"><label class="f" id="prodWrap">製品名<select id="product"><option value="">選択してください</option><option>ホーススイング</option><option>ポニースイング</option><option>フレキサースイング（Ⅰ）</option><option>スペースリング</option><option>フレキサースイングⅡ（プラスチック）</option><option>オーシャンスイング</option><option>プラットホームスイング</option><option>ロングスイング</option><option>スクーターボード</option><option>サンライトスイング</option><option>ポケットスイング</option><option>フロッグスイング</option><option>モンキースイング</option><option>ラダーウォール</option><option>タワーラダー</option><option>円盤ブランコ</option><option>ハンモック</option><option>円盤ブランコ30cm</option><option>空中シーソー</option><option>チューブスイング</option><option>遊び台／飛び石（大）</option><option>遊び台／飛び石（中）</option><option>遊び台／飛び石（小）</option><option>広い遊び橋</option><option>遊び坂</option><option>バランスボード（N型）</option><option>バランスボード（Ⅱ型）</option><option>スイングサポートフレーム</option><option>トランポリン</option><option>スペースローリン</option><option>バースイング</option><option>その他</option></select><input type="text" id="productOther" class="hide" placeholder="製品名を入力" style="margin-top:6px"></label><label class="f hide" id="specWrap">仕様（縫製式／ファスナー式）<select id="spec"><option value="">選択してください</option><option>縫製式</option><option>ファスナー式</option></select></label></div>
<div class="prog" id="prog"></div>
<div id="ropeBox"></div><div id="items"></div>

<div id="layoutWrap" class="hide"><h2>感覚統合室レイアウト</h2><div class="card" id="lcard"><button class="btn sub" id="lfs" type="button" style="margin:0 0 8px">⛶ 横画面で大きく編集</button><div class="lhint" style="font-size:13px;color:var(--sub);margin-bottom:8px">器具名をタップして追加し、ドラッグして好きな位置に動かします。</div><div class="pal" id="pal"></div><div id="bstage"><div class="board" id="board"></div></div><div class="row2"><button class="btn sub" id="ropeUp" type="button">ロープを長く</button><button class="btn sub" id="ropeDn" type="button">ロープを短く</button></div><div class="row2"><button class="btn sub" id="delSel" type="button">選んだ器具を削除</button><button class="btn sub" id="delAll" type="button">すべて消す</button></div></div></div>

<h2>写真（1〜5枚）</h2><div class="card" id="photoCard"><input type="file" id="photos" accept="image/*" multiple><div id="phc" style="font-size:13px;color:var(--sub);margin:6px 0"></div><div class="thumbs" id="thumbs"></div></div>

<h2>総合判定</h2>
<div class="card" id="judgeCard">
 <div class="seg" id="judge"></div>
 <label class="f" style="margin-top:10px">判定理由<textarea id="reason" rows="3"></textarea></label>
</div>

</div>
<h2>ご担当者サイン</h2>
<div class="card">
 <label class="f">ご担当者名<input type="text" id="client"></label>
 <div style="position:relative"><canvas class="sign" id="sig" aria-label="手書きサイン欄"></canvas><button type="button" id="sigopen" style="position:absolute;inset:0;width:100%;background:transparent;border:0;color:#555;font:inherit">タップしてサインを書く</button></div>
 <button class="btn sub" id="clear" type="button">サインを消す</button>
</div>
<div class="err" id="err" role="alert"></div>
<button class="btn" id="make" type="button">全器具のPDFを作成</button><div id="pdfs"></div>
</main>
<div id="sgo" style="display:none;position:fixed;inset:0;z-index:60;background:var(--bg);flex-direction:column;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) calc(10px + env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) calc(10px + env(safe-area-inset-left,0px))"><div style="font-size:13px;color:var(--sub)">スマホを横向きにして、「▲上」が上になる向きで書いてください</div><div style="position:relative;flex:1;min-height:0"><canvas id="sig2" style="position:absolute;left:0;top:0;width:100%;height:100%;background:#fff;border:2px dashed var(--line);border-radius:10px;touch-action:none;box-sizing:border-box"></canvas><div style="position:absolute;top:8px;left:50%;transform:translateX(-50%);padding:2px 12px;border-radius:12px;background:#222;color:#fff;font-size:13px;pointer-events:none;opacity:.8">▲ 上</div></div><div class="row2"><button class="btn sub" id="sgClear" type="button" style="margin:0">消す</button><button class="btn" id="sgOk" type="button" style="margin:0">完了</button></div><button class="btn sub" id="sgCancel" type="button" style="margin:0">キャンセル</button></div>
<div id="prev" style="display:none;position:fixed;inset:0;z-index:50;background:#555;overflow:auto;-webkit-overflow-scrolling:touch"><div style="position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:#222;color:#fff"><span id="prevT" style="font-size:14px"></span><button type="button" id="prevX" style="border:0;border-radius:8px;padding:8px 16px;font:inherit;font-weight:700">閉じる</button></div><div id="prevB" style="padding:10px;display:flex;flex-direction:column;gap:10px;align-items:center"></div></div><div id="stage" style="position:fixed;left:-10000px;top:0"></div>
