<style>

h1{font-size:19px;margin:6px 0 14px}

.pal{display:flex;flex-wrap:wrap;gap:6px}
.pal button{border:1px solid var(--line);background:#fff;color:#111;padding:6px 6px;border-radius:10px;font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;width:78px}.pal button img{height:36px;width:auto;max-width:50px}
.hide{display:none!important}
.row2>*{min-width:0}
input[type=date],input[type=time]{min-width:0;max-width:100%;-webkit-appearance:none;appearance:none;min-height:42px;display:block}

.card.fs .pal{flex-wrap:nowrap;overflow-x:auto;flex:none}
.card.fs .pal button{flex:0 0 auto;width:72px}
.card.fs .row2{flex:none}.card.fs .btn{padding:8px;margin-top:0}

.miss{outline:2px solid var(--ng);outline-offset:2px;border-radius:8px}.item.miss{border-color:var(--ng)}.item.miss::after{content:attr(data-miss);display:block;color:var(--ng);font-size:13px;font-weight:700;margin-top:6px}
.tubes{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}.tubes label{display:flex;align-items:center;gap:6px;padding:8px 14px;border:1px solid var(--line);border-radius:18px}.tubes label:has(input:checked){background:var(--main);color:var(--mainink);border-color:var(--main)}
@media (orientation:landscape) and (max-height:600px){.card.fs{display:grid;grid-template-columns:minmax(0,1fr) 190px;grid-template-rows:repeat(5,auto) 1fr;column-gap:8px;row-gap:6px}.card.fs #bstage{grid-column:1;grid-row:1/-1}.card.fs>*:not(#bstage){grid-column:2}.card.fs .pal{flex-wrap:wrap;overflow-x:hidden;overflow-y:auto;max-height:48vh}.card.fs .pal button{flex:0 0 calc(50% - 3px);width:auto}}

<main>
<h1>感覚統合器具メンテナンスチェックシート</h1>

<h2>点検情報</h2>

</div>

<h2>① 部屋（天井ロープ等）</h2><div class="card"><div class="tabs" id="rooms"></div><button class="btn sub" id="addR" type="button" style="margin-top:0">＋ 部屋を追加</button></div>
<h2>② 点検する器具（スイング他）</h2><div class="card"><div class="tabs" id="devs"></div><button class="btn sub" id="addS" type="button" style="margin-top:0">＋ 器具を追加</button></div>

<div class="prog" id="prog"></div>
<div id="ropeBox"></div><div id="items"></div>

<div id="layoutWrap" class="hide"><h2>感覚統合室レイアウト</h2><div class="card" id="lcard"><button class="btn sub" id="lfs" type="button" style="margin:0 0 8px">⛶ 横画面で大きく編集</button><div class="lhint" style="font-size:13px;color:var(--sub);margin-bottom:8px">器具名をタップして追加し、ドラッグして好きな位置に動かします。</div><div class="pal" id="pal"></div><div id="bstage"><div class="board" id="board"></div></div><div class="row2"><button class="btn sub" id="ropeUp" type="button">ロープを長く</button><button class="btn sub" id="ropeDn" type="button">ロープを短く</button></div><div class="row2"><button class="btn sub" id="delSel" type="button">選んだ器具を削除</button><button class="btn sub" id="delAll" type="button">すべて消す</button></div></div></div>

<h2>写真（1〜5枚）</h2><div class="card" id="photoCard"><input type="file" id="photos" accept="image/*" multiple><div id="phc" style="font-size:13px;color:var(--sub);margin:6px 0"></div><div class="thumbs" id="thumbs"></div></div>

<h2>総合判定</h2>
<div class="card" id="judgeCard">
 <div class="seg" id="judge"></div>
 <label class="f" style="margin-top:10px">判定理由<textarea id="reason" rows="3"></textarea></label>
</div>

</div>
<h2>ご担当者サイン</h2>
<div class="card">
 <label class="f">ご担当者名<input type="text" id="client"></label>
 <div style="position:relative"><canvas class="sign" id="sig" aria-label="手書きサイン欄"></canvas><button type="button" id="sigopen" style="position:absolute;inset:0;width:100%;background:transparent;border:0;color:#555;font:inherit">タップしてサインを書く</button></div>
 <button class="btn sub" id="clear" type="button">サインを消す</button>
</div>
<div class="err" id="err" role="alert"></div>
<button class="btn" id="make" type="button">全器具のPDFを作成</button><div id="pdfs"></div>
</main>
<div id="sgo" style="display:none;position:fixed;inset:0;z-index:60;background:var(--bg);flex-direction:column;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) calc(10px + env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) calc(10px + env(safe-area-inset-left,0px))"><div style="font-size:13px;color:var(--sub)">スマホを横向きにすると広く書けます</div><canvas id="sig2" style="flex:1;min-height:0;width:100%;background:#fff;border:2px dashed var(--line);border-radius:10px;touch-action:none"></canvas><div class="row2"><button class="btn sub" id="sgClear" type="button" style="margin:0">消す</button><button class="btn" id="sgOk" type="button" style="margin:0">完了</button></div><button class="btn sub" id="sgCancel" type="button" style="margin:0">キャンセル</button></div>
<div id="stage" style="position:fixed;left:-10000px;top:0"></div>
